<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- El manifiesto y el registro del service worker los inyecta
         vite-plugin-pwa en el build. Acá va solo lo que ese plugin no cubre:
         iOS ignora los íconos del manifiesto y usa apple-touch-icon, y toma
         el color de la barra de esta meta, no del manifiesto. -->
    <meta name="theme-color" content="#1f5fb8" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Zaha" />
    <title>Zaha — Soporte a la decisión clínica</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Las dos capas del sistema de diseño: Figtree para la clínica, Caprasimo
         para los títulos de marca del login. En un solo pedido. Se cargan acá y
         no con @import desde el CSS: al concatenar las dos hojas en un bundle,
         un @import que queda después de una regla se descarta en silencio. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo:wght@400&family=Figtree:wght@400;500;600;700&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
